[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnium-suite"
version = "1.0.0"
description = "Omnium Suite - Universal Video Downloader TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.52.0",
    "yt-dlp>=2024.1.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omnium = "downloader_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["E501", "PTH118", "PTH123"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = false
files = ["src/downloader_tui"]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "attr-defined", "no-untyped-def", "no-any-return", "import-not-found", "arg-type", "assignment", "attr-defined", "override", "type-arg", "no-untyped-call", "import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/downloader_tui"]
omit = ["tests/*", "src/downloader_tui/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]