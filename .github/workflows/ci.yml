name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      # El gate de formato esta desactivado a proposito: el proyecto no usa
      # `ruff format` (28 de 32 archivos no siguen ese estilo). Si lo adoptas,
      # ejecuta `make fmt` y vuelve a activar esta comprobacion:
      # - name: Ruff format check
      #   run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/downloader_tui --strict

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short